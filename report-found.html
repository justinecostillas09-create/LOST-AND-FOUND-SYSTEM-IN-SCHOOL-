<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Found Item - Campus Lost and Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="py-4">
  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Report Found Item</li>
          </ol>
        </nav>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-success text-white p-3 p-md-4 rounded-top">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-box2-heart-fill fs-3"></i>
              <div>
                <h4 class="fw-bold mb-0">Report a Found Item</h4>
                <p class="mb-0 text-white-50 small">Help return someone's lost belongings by registering found items on campus.</p>
              </div>
            </div>
          </div>

          <div class="card-body p-4 p-md-5">
            <div id="alertBox"></div>

            <form id="foundForm">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Item Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" placeholder="e.g. Black Sony Wireless Headphones" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                  <select class="form-select" id="category" required>
                    <option value="" disabled selected>-- Select a Category --</option>
                    <option value="Electronics">Electronics (Laptops, Phones, Chargers)</option>
                    <option value="IDs & Cards">IDs, Wallets &amp; Campus Cards</option>
                    <option value="Books & Stationery">Books, Notebooks &amp; Stationery</option>
                    <option value="Clothing & Accessories">Clothing, Jackets &amp; Hats</option>
                    <option value="Bags & Backpacks">Bags &amp; Backpacks</option>
                    <option value="Keys">Keys &amp; Keychains</option>
                    <option value="Other">Other Items</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="date" class="form-label fw-semibold">Date Found <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="date" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="location" class="form-label fw-semibold">Location Where Found &amp; Turned In <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="location" placeholder="e.g. Student Union Cafeteria (Handed to Main Security Desk)" required>
                <div class="form-text small">Please mention where you picked it up and where you deposited it.</div>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Description &amp; Condition <span class="text-danger">*</span></label>
                <textarea class="form-control" id="description" rows="4" placeholder="Briefly describe color, brand, condition, and any distinguishing markings..." required></textarea>
              </div>

              <div class="mb-4">
                <label for="photoInput" class="form-label fw-semibold">Upload Photo (Optional)</label>
                <input class="form-control" type="file" id="photoInput" accept="image/*">
                <div class="mt-2 text-center">
                  <img id="photoPreview" src="#" alt="Preview" class="img-thumbnail d-none" style="max-height: 180px;">
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-success px-4 fw-semibold shadow-sm">
                  <i class="bi bi-check2-circle me-1"></i> Submit Found Item
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar('report-found');
  renderFooter();

  document.getElementById('date').value = new Date().toISOString().split('T')[0];

  let uploadedPhoto = 'https://images.unsplash.com/photo-1594980596870-8aa52a78d8cd?w=600&auto=format&fit=crop&q=60';

  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        uploadedPhoto = event.target.result;
        photoPreview.src = event.target.result;
        photoPreview.classList.remove('d-none');
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('foundForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = getCurrentUser() || { email: 'staff@campus.edu', name: 'Security Office Staff' };
    const items = getItems();

    const newItem = {
      id: Date.now(),
      type: 'Found',
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      description: document.getElementById('description').value.trim(),
      date: document.getElementById('date').value,
      location: document.getElementById('location').value.trim(),
      photo: uploadedPhoto,
      status: 'Available for Claim',
      reported_by: user.email,
      created_at: new Date().toISOString().replace('T', ' ').substring(0, 16)
    };

    items.unshift(newItem);
    saveItems(items);

    document.getElementById('alertBox').innerHTML = `
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> Found item has been registered and is now available for search and claims!
        <div class="mt-2">
          <a href="dashboard.html" class="btn btn-sm btn-success me-2">Go to Dashboard</a>
          <a href="search.html" class="btn btn-sm btn-outline-success">View on Search Board</a>
        </div>
      </div>
    `;
    document.getElementById('foundForm').reset();
  });
</script>
</body>
</html>
