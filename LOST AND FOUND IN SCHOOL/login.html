<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Lost and Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="py-4">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                <i class="bi bi-box-arrow-in-right fs-2"></i>
              </div>
              <h3 class="fw-bold">Sign In</h3>
              <p class="text-muted small">Campus Lost and Found Portal</p>
            </div>

            <div id="alertBox"></div>

            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small">Campus Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="name@campus.edu" required autofocus>
                </div>
              </div>

              <div class="mb-4">
                <label for="password" class="form-label fw-semibold small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-1"></i> Log In
              </button>
            </form>

            <div class="text-center small text-muted">
              Don't have an account? <a href="register.html" class="text-primary fw-semibold text-decoration-none">Register here</a>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar('login');
  renderFooter();

  function fillDemo(email, pass) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = pass;
  }

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();

    const users = getUsers();
    const matched = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);

    if (matched) {
      setCurrentUser(matched);
      if (matched.role === 'Admin') {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    } else {
      document.getElementById('alertBox').innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show small" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i> Invalid email or password.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }
  });
</script>
</body>
</html>
