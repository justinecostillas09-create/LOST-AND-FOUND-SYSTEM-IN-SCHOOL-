<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Items - Campus Lost and Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="py-4">
  <div class="container py-3">
    <!-- Header -->
    <div class="mb-4">
      <h2 class="fw-bold"><i class="bi bi-search text-primary me-2"></i>Search Campus Items</h2>
      <p class="text-muted">Filter through all lost and found listings recorded across our campus.</p>
    </div>

    <!-- Search & Filter Card -->
    <div class="card shadow-sm border-0 mb-4 bg-white">
      <div class="card-body p-4">
        <form id="filterForm">
          <div class="row g-3">
            <!-- Keyword -->
            <div class="col-md-5">
              <label for="keyword" class="form-label fw-semibold small">Keyword Search</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" id="keyword" placeholder="Search by name, brand, or description...">
              </div>
            </div>

            <!-- Type -->
            <div class="col-sm-6 col-md-2">
              <label for="type" class="form-label fw-semibold small">Item Type</label>
              <select class="form-select" id="type">
                <option value="All">All Items</option>
                <option value="Found">Found Only</option>
                <option value="Lost">Lost Only</option>
              </select>
            </div>

            <!-- Category -->
            <div class="col-sm-6 col-md-2">
              <label for="category" class="form-label fw-semibold small">Category</label>
              <select class="form-select" id="category">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="IDs & Cards">IDs &amp; Cards</option>
                <option value="Books & Stationery">Books &amp; Stationery</option>
                <option value="Clothing & Accessories">Clothing &amp; Accessories</option>
                <option value="Bags & Backpacks">Bags &amp; Backpacks</option>
                <option value="Keys">Keys</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Location -->
            <div class="col-md-3">
              <label for="location" class="form-label fw-semibold small">Location Filter</label>
              <select class="form-select" id="location">
                <option value="All">All Campus Locations</option>
                <option value="Library">Library</option>
                <option value="Science">Science Complex</option>
                <option value="Lecture Hall">Lecture Hall</option>
                <option value="Dining">Dining / Cafeteria</option>
                <option value="Gym">Gym / Recreation</option>
                <option value="Union">Student Union</option>
                <option value="Engineering">Engineering Hall</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
            <span class="small text-muted" id="resultsCount">Found 0 matching item(s)</span>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="btnReset">
                <i class="bi bi-arrow-counterclockwise me-1"></i> Reset Filters
              </button>
              <button type="submit" class="btn btn-primary btn-sm px-3">
                <i class="bi bi-funnel me-1"></i> Apply Filters
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Results Grid -->
    <div class="row g-4" id="itemsGrid"></div>

  </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar('search');
  renderFooter();

  // URL query params
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('type')) {
    document.getElementById('type').value = urlParams.get('type');
  }

  function applyFilters() {
    const keyword = document.getElementById('keyword').value.toLowerCase().trim();
    const type = document.getElementById('type').value;
    const category = document.getElementById('category').value;
    const location = document.getElementById('location').value;

    const allItems = getItems();
    const filtered = allItems.filter(item => {
      if (type !== 'All' && item.type !== type) return false;
      if (category !== 'All' && item.category !== category) return false;
      if (location !== 'All' && !item.location.toLowerCase().includes(location.toLowerCase())) return false;
      if (keyword) {
        const text = `${item.name} ${item.description} ${item.location}`.toLowerCase();
        if (!text.includes(keyword)) return false;
      }
      return true;
    });

    document.getElementById('resultsCount').textContent = `Found ${filtered.length} matching item(s)`;

    const grid = document.getElementById('itemsGrid');
    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="col-12">
          <div class="card p-5 text-center border-0 shadow-sm bg-white">
            <i class="bi bi-inbox fs-1 text-muted mb-3"></i>
            <h5 class="fw-bold">No Items Matched Your Search</h5>
            <p class="text-muted small">Try broadening your search terms or resetting filters.</p>
          </div>
        </div>
      `;
      return;
    }

    grid.innerHTML = filtered.map(item => `
      <div class="col-sm-6 col-lg-4">
        <div class="card item-card position-relative shadow-sm">
          <span class="badge ${item.type === 'Found' ? 'badge-found' : 'badge-lost'} item-badge-top">
            <i class="bi ${item.type === 'Found' ? 'bi-check-circle' : 'bi-question-circle'} me-1"></i> ${item.type}
          </span>
          <span class="badge bg-dark bg-opacity-75 position-absolute top-0 end-0 m-2 small">
            ${item.status}
          </span>
          <img src="${item.photo}" alt="${item.name}">
          <div class="card-body d-flex flex-column">
            <div class="text-muted small mb-1">
              <i class="bi bi-tag-fill text-secondary me-1"></i> ${item.category}
              <span class="mx-1">&bull;</span>
              <i class="bi bi-calendar-event me-1"></i> ${item.date}
            </div>
            <h5 class="card-title fw-bold text-dark mb-2">${item.name}</h5>
            <p class="card-text text-muted small flex-grow-1">${item.description.substring(0, 95)}...</p>
            <div class="text-secondary small mb-3">
              <i class="bi bi-geo-alt-fill text-danger me-1"></i> ${item.location}
            </div>
            <div class="d-flex gap-2">
              <a href="item-details.html?id=${item.id}" class="btn btn-outline-primary btn-sm w-100 fw-semibold">
                <i class="bi bi-eye me-1"></i> View Details
              </a>
              ${item.type === 'Found' ? `<a href="item-details.html?id=${item.id}#claim" class="btn btn-success btn-sm px-3 fw-semibold">Claim</a>` : ''}
            </div>
          </div>
        </div>
      </div>
    `).join('');
  }

  document.getElementById('filterForm').addEventListener('submit', (e) => {
    e.preventDefault();
    applyFilters();
  });

  document.getElementById('btnReset').addEventListener('click', () => {
    document.getElementById('keyword').value = '';
    document.getElementById('type').value = 'All';
    document.getElementById('category').value = 'All';
    document.getElementById('location').value = 'All';
    applyFilters();
  });

  applyFilters();
</script>
</body>
</html>
