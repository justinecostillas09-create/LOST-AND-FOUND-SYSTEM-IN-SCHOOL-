<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Lost and Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="py-4">
  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
              <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                <i class="bi bi-person-plus fs-2"></i>
              </div>
              <h3 class="fw-bold">Create an Account</h3>
              <p class="text-muted small">Register to report items, search, and submit ownership claims</p>
            </div>

            <div id="alertBox"></div>

            <form id="registerForm">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold small">Full Name</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-person"></i></span>
                  <input type="text" class="form-control" id="name" placeholder="e.g. Jordan Smith" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="email" class="form-label fw-semibold small">Campus Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-white text-muted"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" id="email" placeholder="name@campus.edu" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="role" class="form-label fw-semibold small">Account Role</label>
                <select class="form-select" id="role">
                  <option value="User" selected>User (Student / Regular User)</option>
                  <option value="Staff">Staff (Security / Department Representative)</option>
                </select>
                <div class="form-text small">Select User if you are a student or general campus visitor.</div>
              </div>

              <div class="row g-2 mb-4">
                <div class="col-sm-6">
                  <label for="password" class="form-label fw-semibold small">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
                    <input type="password" class="form-control" id="password" placeholder="At least 6 chars" required minlength="6">
                  </div>
                </div>
                <div class="col-sm-6">
                  <label for="confirm_password" class="form-label fw-semibold small">Confirm Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-lock"></i></span>
                    <input type="password" class="form-control" id="confirm_password" placeholder="Re-enter password" required>
                  </div>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm mb-3">
                <i class="bi bi-person-check me-1"></i> Register Account
              </button>
            </form>

            <div class="text-center small text-muted">
              Already registered? <a href="login.html" class="text-primary fw-semibold text-decoration-none">Log in here</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar('register');
  renderFooter();

  document.getElementById('registerForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const role = document.getElementById('role').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;

    const alertBox = document.getElementById('alertBox');

    if (password !== confirm_password) {
      alertBox.innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show small" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i> Password and Confirm Password do not match.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
      return;
    }

    const users = getUsers();
    if (users.some(u => u.email.toLowerCase() === email.toLowerCase())) {
      alertBox.innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show small" role="alert">
          <i class="bi bi-exclamation-triangle me-1"></i> This email address is already registered.
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
      return;
    }

    const newUser = {
      id: Date.now(),
      name,
      email,
      role,
      password
    };
    users.push(newUser);
    saveUsers(users);

    alertBox.innerHTML = `
      <div class="alert alert-success alert-dismissible fade show small" role="alert">
        <i class="bi bi-check-circle me-1"></i> Account registered successfully! Redirecting to login...
      </div>
    `;
    setTimeout(() => {
      window.location.href = 'login.html';
    }, 1200);
  });
</script>
</body>
</html>
