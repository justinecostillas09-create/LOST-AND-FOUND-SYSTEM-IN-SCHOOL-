<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Lost Item - Campus Lost and Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="navbarContainer"></div>

<main class="py-4">
  <div class="container py-3">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <nav aria-label="breadcrumb" class="mb-3">
          <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="breadcrumb-item active" aria-current="page">Report Lost Item</li>
          </ol>
        </nav>

        <div class="card shadow-sm border-0">
          <div class="card-header bg-danger text-white p-3 p-md-4 rounded-top">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-exclamation-octagon-fill fs-3"></i>
              <div>
                <h4 class="fw-bold mb-0">Report a Lost Item</h4>
                <p class="mb-0 text-white-50 small">Provide accurate details to help campus staff and students find your item.</p>
              </div>
            </div>
          </div>

          <div class="card-body p-4 p-md-5">
            <div id="alertBox"></div>

            <form id="lostForm">
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Item Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="name" placeholder="e.g. Blue Dell Inspiron Laptop 15-inch" required>
              </div>

              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                  <select class="form-select" id="category" required>
                    <option value="" disabled selected>-- Select a Category --</option>
                    <option value="Electronics">Electronics (Laptops, Phones, Chargers)</option>
                    <option value="IDs & Cards">IDs, Wallets &amp; Campus Cards</option>
                    <option value="Books & Stationery">Books, Notebooks &amp; Stationery</option>
                    <option value="Clothing & Accessories">Clothing, Jackets &amp; Hats</option>
                    <option value="Bags & Backpacks">Bags &amp; Backpacks</option>
                    <option value="Keys">Keys &amp; Keychains</option>
                    <option value="Other">Other Items</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label for="date" class="form-label fw-semibold">Date Lost <span class="text-danger">*</span></label>
                  <input type="date" class="form-control" id="date" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="location" class="form-label fw-semibold">Last Known Location on Campus <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="location" placeholder="e.g. Science Library, 2nd floor desk #14" required>
              </div>

              <div class="mb-3">
                <label for="description" class="form-label fw-semibold">Detailed Description <span class="text-danger">*</span></label>
                <textarea class="form-control" id="description" rows="4" placeholder="Describe distinct color, brand, stickers, scratches, case, or contents..." required></textarea>
              </div>

              <div class="mb-4">
                <label for="photoInput" class="form-label fw-semibold">Upload Photo (Optional)</label>
                <input class="form-control" type="file" id="photoInput" accept="image/*">
                <div class="mt-2 text-center">
                  <img id="photoPreview" src="#" alt="Preview" class="img-thumbnail d-none" style="max-height: 180px;">
                </div>
              </div>

              <div class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="btn btn-outline-secondary">
                  <i class="bi bi-arrow-left me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-danger px-4 fw-semibold shadow-sm">
                  <i class="bi bi-send me-1"></i> Submit Lost Report
                </button>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<div id="footerContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
<script>
  renderNavbar('report-lost');
  renderFooter();

  document.getElementById('date').value = new Date().toISOString().split('T')[0];

  let uploadedPhoto = 'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=60';

  const photoInput = document.getElementById('photoInput');
  const photoPreview = document.getElementById('photoPreview');
  photoInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (event) => {
        uploadedPhoto = event.target.result;
        photoPreview.src = event.target.result;
        photoPreview.classList.remove('d-none');
      };
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('lostForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const user = getCurrentUser() || { email: 'student@campus.edu', name: 'Alex Johnson' };
    const items = getItems();

    const newItem = {
      id: Date.now(),
      type: 'Lost',
      name: document.getElementById('name').value.trim(),
      category: document.getElementById('category').value,
      description: document.getElementById('description').value.trim(),
      date: document.getElementById('date').value,
      location: document.getElementById('location').value.trim(),
      photo: uploadedPhoto,
      status: 'Open (Searching)',
      reported_by: user.email,
      created_at: new Date().toISOString().replace('T', ' ').substring(0, 16)
    };

    items.unshift(newItem);
    saveItems(items);

    document.getElementById('alertBox').innerHTML = `
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> Your lost item report has been published successfully!
        <div class="mt-2">
          <a href="dashboard.html" class="btn btn-sm btn-success me-2">Go to Dashboard</a>
          <a href="search.html" class="btn btn-sm btn-outline-success">View on Search Board</a>
        </div>
      </div>
    `;
    document.getElementById('lostForm').reset();
  });
</script>
</body>
</html>
